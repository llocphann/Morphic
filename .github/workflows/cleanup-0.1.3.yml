name: Morphic 0.1.3 source cleanup

on:
  push:
    branches:
      - cleanup/0.1.3
    paths:
      - "eslint.config.mjs"
      - ".github/workflows/cleanup-0.1.3.yml"

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/0.1.3

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify pinned npm runner
        run: node scripts/pinned-npm.mjs --version

      - name: Install dependencies
        run: node scripts/pinned-npm.mjs install --ignore-scripts --no-package-lock

      - name: Apply official lint autofixes
        shell: bash
        run: |
          node scripts/pinned-npm.mjs run lint:fix || true
          git diff --check

      - name: Commit autofixed source
        shell: bash
        run: |
          if git diff --quiet -- src; then
            echo "Obsidian lint autofix produced no source changes" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "refactor: apply current Obsidian lint autofixes"
          git push origin HEAD:cleanup/0.1.3
