name: Morphic 0.1.3 strict lint probe

on:
  push:
    branches:
      - cleanup/0.1.3
    paths:
      - "eslint.config.mjs"
      - ".github/workflows/cleanup-0.1.3.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/0.1.3

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify pinned npm runner
        run: node scripts/pinned-npm.mjs --version

      - name: Install dependencies
        run: node scripts/pinned-npm.mjs install --ignore-scripts --no-package-lock

      - name: Strict lint
        run: node scripts/pinned-npm.mjs run lint
